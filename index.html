<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Harvest Weather Lab</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body>
    <h1>Harvest Weather Lab</h1>

    <div id="weather"></div>
<div id="cropSelection">
    <button id="wheatButton">🌾 Wheat</button>
    <button id="cornButton">🌽 Corn</button>
    <button id="carrotButton">🥕 Carrot</button>
</div>

<div id="weatherControls">
    <label for="rainfallInput">Rainfall</label>
    <input type="range" id="rainfallInput" min="0" max="20" value="0">

    <span id="rainfallValue">0</span>
    </div>

<div>
    <label for="temperatureInput">Temperature</label>
    <input type="range" id="temperatureInput" min="5" max="35" value="20">
    <span id="temperatureValue">20</span>°C
</div>

<div>
    <label for="sunlightInput">Sunlight:</label>
    <input type="range" id="sunlightInput" min="0" max="14" value="8">

    <span id="sunlightValue">8</span> hours
</div>

    <button id="advanceButton">Advance 1 Hour</button>


    <h2>Farm</h2>
    <div id="farm"></div>
<div id="cropInfo">
<p>Click a plot to see its information</p>
</div>
<div id="harvestStats">
    <h3>Harvest Statistics</h3>
    <p>Total crops harvested: <span id="totalCrops">0</span></p>
<p>Total yield: <span id="totalYield">0</span></p>
<p>Wheat yield: <span id="wheatYield">0</span></p>
<p>Corn yield: <span id="cornYield">0</span></p>
<p>Carrot yield: <span id="carrotYield">0</span></p>
</div>

     <script src="crops.js"></script>
     <script src="weather.js"></script>
    <script src="simulation.js"></script>
    <script src="app.js"></script>
</body>

</html>
